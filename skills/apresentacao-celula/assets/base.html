<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO}} — {{PREGADOR}} — Bola de Neve Londrina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
:root{
  --creme:#F2EFE8; --creme-2:#E9E3D6; --areia:#DCCFBA;
  --vinho:#9E1B32; --vinho-forte:#A10A24; --vinho-claro:#D6404F;
  --dourado:#C9A25A; --dourado-claro:#E3C27E;
  --marinho:#0E1A2B; --taupe:#55504A; --taupe-2:#48433E;
  --tinta:#1E1C1A; --cinza:#5E5953; --linha:#CFC7B8;
  --serif:'Playfair Display', Georgia, serif;
  --sans:'Montserrat', 'Segoe UI', Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#111;overflow:hidden}
body{font-family:var(--sans);color:var(--tinta)}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.deck{width:1920px;height:1080px;position:relative;flex:none;transform-origin:center center}
.slide{position:absolute;inset:0;display:none;overflow:hidden;background:var(--creme)}
.slide.ativo{display:block;animation:entra .4s ease}
@keyframes entra{from{opacity:0}to{opacity:1}}
.abs{position:absolute}
.serif{font-family:var(--serif)}
.vinho{color:var(--vinho)} .dourado{color:var(--dourado)}
b{font-weight:700}

/* cabeçalho de seção (pequeno, com fio) */
.secao{position:absolute;left:96px;right:96px;top:64px;display:flex;align-items:center;gap:28px;font-family:var(--serif);font-size:30px;color:var(--tinta)}
.secao::after{content:"";flex:1;height:2px;background:var(--linha)}
.secao.sem-fio::after{display:none}
.logo{position:absolute;right:72px;top:40px;width:110px;height:110px;object-fit:contain}
.secao + .logo, .com-logo .secao{right:220px}
.ref{font-family:var(--sans);font-weight:700;color:var(--vinho);font-size:28px;font-style:normal}
.faixa-vinho{position:absolute;left:0;right:0;bottom:48px;height:92px;background:var(--vinho-forte);color:#F6EEE4;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:36px;padding:0 60px;text-align:center}
.faixa-vinho.sans{font-family:var(--sans);font-weight:700;font-size:30px}
.pagina{position:absolute;left:96px;bottom:22px;font-size:20px;color:#8E877D;letter-spacing:1px}
.escuro .pagina,.vermelho .pagina{color:rgba(246,238,228,.55)}

/* tabelas comparativas */
.comp{position:absolute;left:96px;right:96px;border-collapse:collapse;font-size:34px}
.comp th{font-family:var(--serif);font-weight:400;font-size:46px;padding:0 24px 22px;text-align:center}
.comp td{padding:26px 24px;border-top:2px solid var(--linha);text-align:center;line-height:1.3;vertical-align:middle}
.comp td.rot{font-family:var(--serif);font-size:36px;color:var(--cinza);text-align:left;width:260px;white-space:nowrap}
.comp .dir{border-left:3px solid var(--vinho);color:var(--vinho)}
.comp th.dir{color:var(--vinho)}

.hud{position:fixed;right:14px;bottom:10px;color:#999;font:13px/1 var(--sans);user-select:none;z-index:9;transition:opacity .4s}
.hud button{background:rgba(0,0,0,.35);border:1px solid #555;color:#ddd;border-radius:6px;padding:6px 10px;margin-left:6px;cursor:pointer;font:inherit}
.hud.oculto{opacity:0}
@media print{
  @page{size:1920px 1080px;margin:0}
  html,body{overflow:visible;height:auto;background:none}
  .stage{position:static;display:block}.deck{transform:none!important;height:auto}
  .slide{position:relative;display:block!important;width:1920px;height:1080px;page-break-after:always;animation:none}
  .hud{display:none}
}
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck">

{{SLIDES}}
</div></div>

<div class="hud" id="hud"><span id="contador"></span><button id="ant" aria-label="Anterior">‹</button><button id="prox" aria-label="Próximo">›</button><button id="tela" aria-label="Tela cheia">⛶</button></div>
<script>
(function(){
  var deck=document.getElementById('deck'),slides=[].slice.call(deck.querySelectorAll('.slide')),i=0;
  slides.forEach(function(s,n){if(n<1)return;var p=document.createElement('p');p.className='pagina';p.textContent=(n+1)+' / '+slides.length;s.appendChild(p);});
  function escala(){deck.style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')';}
  function ir(n){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach(function(s,k){s.classList.toggle('ativo',k===i)});
    document.getElementById('contador').textContent=(i+1)+' / '+slides.length;try{history.replaceState(null,'','#'+(i+1))}catch(e){}}
  function tela(){if(!document.fullscreenElement){var d=document.documentElement;d.requestFullscreen&&d.requestFullscreen()}else document.exitFullscreen();}
  addEventListener('resize',escala);
  addEventListener('keydown',function(e){
    if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].indexOf(e.key)>-1){e.preventDefault();ir(i+1)}
    else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].indexOf(e.key)>-1){e.preventDefault();ir(i-1)}
    else if(e.key==='Home')ir(0);else if(e.key==='End')ir(slides.length-1);else if(e.key==='f'||e.key==='F')tela();});
  document.getElementById('ant').onclick=function(e){e.stopPropagation();ir(i-1)};
  document.getElementById('prox').onclick=function(e){e.stopPropagation();ir(i+1)};
  document.getElementById('tela').onclick=function(e){e.stopPropagation();tela()};
  document.querySelector('.stage').addEventListener('click',function(e){ir(e.clientX<innerWidth/3?i-1:i+1)});
  var x0=null;addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  addEventListener('touchend',function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)ir(d<0?i+1:i-1);x0=null});
  var hud=document.getElementById('hud'),t;addEventListener('mousemove',function(){hud.classList.remove('oculto');clearTimeout(t);t=setTimeout(function(){hud.classList.add('oculto')},2000)});
  escala();ir((parseInt(location.hash.slice(1),10)||1)-1);
})();
</script>
</body>
</html>
